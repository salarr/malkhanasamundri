  <script>
'use strict';
const SHEETS = ['Mad_Number_T','Main','Accused_T','Talfi_T','Temp_Out_T','Sapurdari_T','Resources'];
// Names as they may be spelled in the Excel file (Access export) -> page uses the correct name internally, file keeps its own spelling on save.
const SHEET_ALIASES={Accused_T:['Accuseed_T']};
const COL_ALIASES={Accused_ID:['Accuseed_ID'],Chassis_Number:['Chessis_Number'],Investigating_Officer:['Investigating_Offier'],Sapurdari_Date:['Supardari_Date']};
let fileNames={sheets:{},cols:{}};
const toFile=k=>fileNames.cols[k]||k;
const SCHEMA = {
  Main: ['ID','Madd_Number','FIR_Number','FIR_Dated','Under_Section','Police_Station','Investigating_Officer'],
  Accused_T: ['Accused_ID','Accused_Name','Road_Number','Road_Issuance_Date','Received_On','Case_Property','Type_Of_Case_Property','Detail_Of_Case_Property','Registration_Number','Engine_Number','Present_or_Disposed_off','Chassis_Number','Main_Accused'],

  Sapurdari_T: ['Sapurdari_ID','Sapurdari_Date','Decision_of_Court','Main_TbID'],
  Mad_Number_T: ['Madd_ID','Mad_Number'],
  Resources: []
};
// Correct duplicate field labels to match the screenshot's visible table structure.
SCHEMA.Temp_Out_T = ['Temp_ID','Temp_Issuance_Date','Temp_Returned_Date','Temp_Court','Court_Name','Temp_Officer','Main_TempID'];
const PRIMARY = {Main:'ID',Accused_T:'Accused_ID',Talfi_T:'Talfi_ID',Temp_Out_T:'Temp_ID',Sapurdari_T:'Sapurdari_ID',Mad_Number_T:'Madd_ID'};
const FOREIGN = {Accused_T:'Main_Accused',Talfi_T:'Main_TID',Temp_Out_T:'Main_TempID',Sapurdari_T:'Main_TbID'};
const LABELS = {
  ID:'ID',Madd_Number:'مد نمبر',FIR_Number:'FIR نمبر',FIR_Dated:'FIR تاریخ',Under_Section:'زیر دفعہ',Police_Station:'پولیس اسٹیشن',Investigating_Officer:'تفتیشی افسر',
  Accused_ID:'Accused ID',Accused_Name:'ملزم کا نام',Road_Number:'روڈ سرٹیفکیٹ نمبر',Road_Issuance_Date:'روڈ سرٹیفکیٹ اجرا کی تاریخ',Received_On:'وصولی کی تاریخ',Case_Property:'کیس پراپرٹی',Type_Of_Case_Property:'پراپرٹی کی قسم',Detail_Of_Case_Property:'پراپرٹی کی تفصیل',Registration_Number:'رجسٹریشن نمبر',Engine_Number:'انجن نمبر',Present_or_Disposed_off:'موجود / تلف شدہ',Chassis_Number:'چیسس نمبر',Main_Accused:'Main ID (Link)',
  Talfi_ID:'Talfi ID',Talfi_Madd_Number:'Talfi مد نمبر',Date_of_Decision_of_Court:'عدالتی فیصلے کی تاریخ',Detail_of_Decision_of_Court:'عدالتی فیصلے کی تفصیل',Main_TID:'Accused ID (Link)',
  Temp_ID:'Temporary ID',Temp_Issuance_Date:'عارضی اجرا کی تاریخ',Temp_Returned_Date:'واپسی کی تاریخ',Temp_Court:'عدالت / اجرا کی نوعیت',Court_Name:'عدالت کا نام',Temp_Officer:'متعلقہ افسر',Main_TempID:'Accused ID (Link)',
  Sapurdari_ID:'Sapurdari ID',Sapurdari_Date:'سپرداری کی تاریخ',Decision_of_Court:'عدالتی حکم / فیصلہ',Main_TbID:'Accused ID (Link)',Madd_ID:'مد ID',Mad_Number:'مد نمبر'
};
let workbook = null, data = {}, selectedMain = null, selectedAccused = null, editingMain = null, editingAccused = null, editingRelated = null, currentRelatedTable = null, toastTimer = null;
let accBlock = null, editingDraft = null, pendingHandle = null, workbookHandle = null, autoSaveTimer = null, isWritingWorkbook = false, workbookFileName = 'Malkhana_Samundri_Faisalabad.xlsx';
const $ = id => document.getElementById(id);
function rows(table){ if(!data[table]) data[table]=[]; return data[table]; }
function val(v){return v===undefined||v===null?'':String(v);}
const DATE_KEYS=['Road_Issuance_Date','Received_On'];
function parseDate(s){s=val(s).trim();if(!s)return null;let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return{y:+m[1],m:+m[2],d:+m[3]};m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!m)return null;let a=+m[1],b=+m[2],y=+m[3],d,mo;if(m[3].length===2){y+=y<70?2000:1900;if(a>12){d=a;mo=b;}else{mo=a;d=b;}}else{d=a;mo=b;}if(mo<1||mo>12||d<1||d>31)return null;return{y,m:mo,d};}
function toISO(s){const p=parseDate(s);return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:'';}
function fmtDMY(s){const p=parseDate(s);return p?`${String(p.d).padStart(2,'0')}/${String(p.m).padStart(2,'0')}/${p.y}`:'';}
let resOpts={};let resLinks={};
function normKey(s){return val(s).trim().toLowerCase().replace(/\s+/g,'_');}
function loadResources(wb){resOpts={};resLinks={Case_Property:{}};const ws=wb&&wb.Sheets&&wb.Sheets['Resources'];if(!ws)return;const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});const keyOf={};Object.keys(LABELS).forEach(k=>{keyOf[normKey(k)]=k;keyOf[normKey(LABELS[k])]=k;});arr.forEach(r=>{const k=keyOf[normKey(r[0])];const v=val(r[1]).trim();if(!k||!v)return;(resOpts[k]=resOpts[k]||[]);if(!resOpts[k].includes(v))resOpts[k].push(v);const link=val(r[2]).trim();if(k==='Case_Property'&&link){if(!resLinks.Case_Property[v])resLinks.Case_Property[v]=link;(resOpts.Type_Of_Case_Property=resOpts.Type_Of_Case_Property||[]);if(!resOpts.Type_Of_Case_Property.includes(link))resOpts.Type_Of_Case_Property.push(link);}});}
function makeSelect(key,current){const s=document.createElement('select');const cur=val(current).trim();const opts=[...(resOpts[key]||[])];if(cur&&!opts.includes(cur))opts.unshift(cur);s.appendChild(new Option('— منتخب کریں —',''));opts.forEach(o=>s.appendChild(new Option(o,o)));s.value=cur;return s;}
function esc(s){return val(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3300);}
function primary(table){return PRIMARY[table];}
function nextId(table){const key=primary(table);if(!key)return '';return rows(table).reduce((m,r)=>Math.max(m,Number(r[key])||0),0)+1;}
function ensureSchema(){SHEETS.forEach(s=>{if(!data[s])data[s]=[];});}
function headerRow(sheet){return (sheet&&sheet.length)?sheet[0].map(v=>String(v??'').trim()):[];}
function normalizeWorkbook(wb){data={};fileNames={sheets:{},cols:{}};SHEETS.forEach(name=>{const actual=wb.Sheets[name]?name:(SHEET_ALIASES[name]||[]).find(a=>wb.Sheets[a]);const ws=actual?wb.Sheets[actual]:null;if(!ws){data[name]=[];return;}fileNames.sheets[name]=actual;const json=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});data[name]=json.map(r=>{const o={};for(const k of Object.keys(r)){const canon=Object.keys(COL_ALIASES).find(c=>COL_ALIASES[c].includes(k));if(canon){o[canon]=r[k];fileNames.cols[canon]=k;}else o[k]=r[k];}return o;});});ensureSchema();loadResources(wb);}
function buildFields(containerId, table, record={}, mode='edit', hiddenKeys=[]){const wrap=$(containerId);wrap.innerHTML='';const fields=SCHEMA[table]||[];fields.forEach(key=>{const hidden=hiddenKeys.includes(key)||key===primary(table);const field=document.createElement('div');field.className='field';if(hidden){field.hidden=true;}const label=document.createElement('label');label.htmlFor=`${containerId}_${key}`;label.textContent=LABELS[key]||key;let ctl;if(resOpts[key]&&!hidden){ctl=makeSelect(key,record[key]);}else{ctl=(key.toLowerCase().includes('detail')||key.toLowerCase().includes('property')||key==='Decision_of_Court'||key==='Under_Section')?document.createElement('textarea'):document.createElement('input');ctl.value=val(record[key]);ctl.autocomplete='off';if(DATE_KEYS.includes(key)){ctl.type='date';const raw=val(record[key]).trim();ctl.value=toISO(raw);if(raw&&!ctl.value)ctl.dataset.orig=raw;}else if(/date/i.test(key))ctl.placeholder='مثلاً 24/10/2026';else ctl.placeholder=LABELS[key]||key;if(key===primary(table)){ctl.readOnly=true;ctl.value=record[key]??nextId(table);}if(hidden){ctl.value=val(record[key]);}}ctl.id=`${containerId}_${key}`;ctl.name=key;field.append(label,ctl);wrap.appendChild(field);});const cp=$(`${containerId}_Case_Property`),tp=$(`${containerId}_Type_Of_Case_Property`);if(cp&&tp&&cp.tagName==='SELECT'&&tp.tagName==='SELECT')cp.addEventListener('change',()=>{const ty=resLinks.Case_Property&&resLinks.Case_Property[cp.value];if(ty){if(![...tp.options].some(o=>o.value===ty))tp.appendChild(new Option(ty,ty));tp.value=ty;}});}
function formValues(containerId,table){const out={};(SCHEMA[table]||[]).forEach(k=>{const el=$(`${containerId}_${k}`);if(!el)return;if(el.type==='date'){out[k]=el.value?fmtDMY(el.value):(el.dataset.orig||'');}else out[k]=el.value.trim();});return out;}
function currentMain(){return rows('Main').find(r=>String(r.ID)===String(selectedMain))||null;}
function currentAccused(){return rows('Accused_T').find(r=>String(r.Accused_ID)===String(selectedAccused))||null;}
function updateStatus(){const has=!!workbook;$('workbookStatus').textContent=has?'Excel فائل منسلک ہے':(pendingHandle?'پچھلی Excel فائل اجازت کی منتظر ہے':'Excel فائل منسلک نہیں');$('workbookStatus').className='status-pill '+(has?'connected':'offline');$('saveWorkbookBtn').disabled=!has;$('downloadCopyBtn').disabled=!has;$('disconnectBtn').disabled=!has&&!pendingHandle;$('reconnectBtn').hidden=has||!pendingHandle;$('autoSaveStatus').textContent=has?(workbookHandle?'خودکار محفوظ کاری فعال':'خودکار محفوظ کاری دستی اجازت کی منتظر'):'خودکار محفوظ کاری بند';$('mainForm').hidden=!has;if(!has){$('mainRows').innerHTML='';}}
function norm(v){const s=val(v).trim();return /^\d+\.0+$/.test(s)?s.replace(/\.0+$/,''):s;}
function mainsForMad(num){const n=norm(num);return n?rows('Main').filter(r=>norm(r.Madd_Number)===n):[];}
const ROW_FIELDS=['FIR_Number','FIR_Dated','Under_Section','Police_Station','Investigating_Officer'];
function makeRow(rec={}){const block=document.createElement('div');block.className='fir-block';block.dataset.id=val(rec.ID);block._draft=[];const row=document.createElement('div');row.className='main-row';['Madd_Number',...ROW_FIELDS].forEach(k=>{const f=document.createElement('div');f.className='field';const l=document.createElement('label');l.textContent=k==='Madd_Number'?'مد نمبر':(LABELS[k]||k);const dd=k!=='Madd_Number'&&resOpts[k];const i=dd?makeSelect(k,rec[k]):document.createElement('input');i.name=k;if(!dd){i.value=val(rec[k]);i.autocomplete='off';i.placeholder=k==='Madd_Number'?'مد نمبر':(/date/i.test(k)?'مثلاً 24/10/2026':(LABELS[k]||k));}f.append(l,i);row.appendChild(f);});row.addEventListener('focusin',()=>{if(block.dataset.id&&String(selectedMain)!==block.dataset.id)selectMain(block.dataset.id,true);});row.addEventListener('change',()=>{block.dataset.dirty='1';});block.appendChild(row);const area=document.createElement('div');area.className='accused-area';area.innerHTML='<div class="accused-bar"><span class="accused-title">ملزمان اور مال مقدمہ کی تفصیل</span><button type="button" class="btn btn-success btn-sm acc-add">ملزم کا اندراج</button></div><div class="accused-items"></div>';area.querySelector('.acc-add').onclick=()=>{accBlock=block;selectedMain=block.dataset.id||null;highlightRow();openAccusedForm();};block.appendChild(area);return block;}
const isDirty=b=>b.dataset.dirty==='1'||(!b.dataset.id&&b._draft&&b._draft.length>0);
function confirmDiscard(){const d=[...document.querySelectorAll('#mainRows .fir-block')].some(isDirty);return !d||confirm('غیر محفوظ تبدیلیاں موجود ہیں۔ کیا آپ انہیں چھوڑ کر آگے بڑھنا چاہتے ہیں؟');}
function clearMainForm(){$('madSearch').value='';selectedMain=null;selectedAccused=null;editingMain=null;editingAccused=null;closeAccused();$('relatedPanel').hidden=true;closeRelatedForm();if(workbook)renderMainRows([]);}
function saveMainForm(){if(!workbook){toast('پہلے Excel فائل منسلک کریں۔');return;}const items=[];for(const b of document.querySelectorAll('#mainRows .fir-block')){const v={};b.querySelectorAll('.main-row input,.main-row select').forEach(i=>v[i.name]=i.value.trim());v.Madd_Number=norm(v.Madd_Number);const has=ROW_FIELDS.some(k=>v[k])||(b._draft&&b._draft.length);if(!b.dataset.id&&!has)continue;if(!v.Madd_Number){toast('ہر مقدمے کے لیے مد نمبر لکھیں۔');b.querySelector('[name=Madd_Number]').focus();return;}items.push({b,v});}
if(!items.length){toast('محفوظ کرنے کے لیے کوئی ریکارڈ نہیں۔');return;}
for(const {b,v} of items){const id=b.dataset.id;if(id){const rec=rows('Main').find(r=>String(r.ID)===String(id));if(rec)Object.assign(rec,v);}else{const rec={ID:nextId('Main'),...v};rows('Main').push(rec);(b._draft||[]).forEach(a=>{rows('Accused_T').push({...a,Accused_ID:nextId('Accused_T'),Main_Accused:String(rec.ID)});});}}
scheduleAutoSave();clearMainForm();if(!$('tabList').hidden)renderMadList();toast('مقدمات اور متعلقہ ملزمان محفوظ ہوگئے۔');}

function buildWorkbook(){
 const wb=XLSX.utils.book_new();
 SHEETS.forEach(name=>{
   if(name==='Resources'&&workbook?.Sheets?.Resources){XLSX.utils.book_append_sheet(wb,workbook.Sheets.Resources,'Resources');return;}
   let arr=rows(name).map(r=>{const o={};for(const k of Object.keys(r))o[toFile(k)]=r[k];return o;});
   if(name==='Resources'&&arr.length===0&&workbook?.Sheets[name])arr=XLSX.utils.sheet_to_json(workbook.Sheets[name],{defval:'',raw:false});
   let headers=(SCHEMA[name]||[]).map(toFile);
   if(arr.length){const existing=Object.keys(arr[0]);headers=[...new Set([...existing,...headers])];}
   else if(workbook?.Sheets[fileNames.sheets[name]||name]){const raw=XLSX.utils.sheet_to_json(workbook.Sheets[fileNames.sheets[name]||name],{header:1,blankrows:false});headers=raw[0]||headers;}
   const ws=XLSX.utils.json_to_sheet(arr,{header:headers.length?headers:undefined});
   XLSX.utils.book_append_sheet(wb,ws,fileNames.sheets[name]||name);
 });
 return wb;
}

}

function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('malkhana_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}

async function idbDel(k){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function attachHandle(h){workbookHandle=h;workbookFileName=h.name;pendingHandle=null;const file=await h.getFile();loadFile(file,true);}
async function restoreWorkbook(){try{const h=await idbGet('wbHandle');if(!h)return;pendingHandle=h;if((await h.queryPermission({mode:'readwrite'}))==='granted'){await attachHandle(h);}else{updateStatus();toast('پچھلی Excel فائل ملی ہے؛ کسی بھی جگہ کلک کریں یا "دوبارہ منسلک کریں" دبائیں۔');}}catch(e){console.warn('restore',e);}}
let autoTried=false;
let reconnecting=false;
async function reconnectWorkbook(){const h=pendingHandle;if(!h||reconnecting)return;reconnecting=true;try{const p=await h.requestPermission({mode:'readwrite'});if(p==='granted')await attachHandle(h);else toast('اجازت نہیں ملی؛ "دوبارہ منسلک کریں" دبا کر Allow کریں۔');}catch(e){console.warn(e);toast('فائل دوبارہ منسلک نہیں ہو سکی؛ "Excel فائل منسلک / کھولیں" سے منتخب کریں۔');}finally{reconnecting=false;}}
document.addEventListener('click',e=>{if(pendingHandle&&!workbook&&!autoTried&&!e.target.closest('#disconnectBtn,#reconnectBtn,#loadWorkbookBtn')){autoTried=true;reconnectWorkbook();}},true);
$('reconnectBtn').onclick=()=>{autoTried=true;reconnectWorkbook();};
async function disconnectWorkbook(){if(!confirm('کیا آپ Excel فائل Disconnect کرنا چاہتے ہیں؟ (فائل میں کوئی تبدیلی نہیں ہوگی)'))return;clearTimeout(autoSaveTimer);if(workbook&&workbookHandle){await saveToConnectedFile(false);}workbook=null;workbookHandle=null;pendingHandle=null;data={};ensureSchema();selectedMain=null;selectedAccused=null;editingMain=null;editingAccused=null;try{await idbDel('wbHandle');}catch(e){}$('relatedPanel').hidden=true;closeRelatedForm();closeAccused();$('mainRows').innerHTML='';updateStatus();renderMadList();toast('Excel فائل Disconnect ہوگئی۔');}
$('disconnectBtn').onclick=disconnectWorkbook;

// ---------- Version check & Update (GitHub) ----------
const APP_VERSION='1.0.0';
const UPDATE_URL='https://raw.githubusercontent.com/salarr/malkhanasamundri/main/version.json';
let newer=null;
const setUpd=m=>{$('updateStatus').textContent=m;};
const isNewer=(a,b)=>{a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(let i=0;i<3;i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y;}return false;};
function showUpdateAvailable(on){$('updArrow').hidden=!on;$('updateNowBtn').hidden=!on;$('updateNowBtn').disabled=!on;}
async function checkUpdate(manual){
  if(UPDATE_URL.includes('YOUR-')){if(manual)toast('اپڈیٹ کا لنک سیٹ نہیں');return;}
  if(!navigator.onLine){if(manual){setUpd('انٹرنیٹ کنکشن نہیں');toast('انٹرنیٹ کنکشن نہیں');}return;}
  try{
    const j=await(await fetch(UPDATE_URL+'?t='+Date.now(),{cache:'no-store'})).json();
    if(isNewer(j.version,APP_VERSION)){newer=j;showUpdateAvailable(true);setUpd(`نیا ورژن ${j.version} دستیاب ہے${j.notes?' — '+j.notes:''}`);if(manual)toast('نیا ورژن دستیاب ہے');}
    else{showUpdateAvailable(false);setUpd('آپ کے پاس تازہ ترین ورژن ہے ✓');if(manual)toast('آپ تازہ ترین ورژن استعمال کر رہے ہیں');}
  }catch(e){if(manual){setUpd('ورژن چیک نہیں ہو سکا');toast('اپڈیٹ چیک نہیں ہو سکی');}}
}
async function applyUpdate(){
  if(!newer)return;
  if(!window.showOpenFilePicker){window.open(new URL(newer.url||'Malkhana_Samundri_Faisalabad.html',UPDATE_URL).href);return;}
  try{
    let h=null;try{h=await idbGet('appHandle');}catch(e){}
    let ok=false;try{ok=!!h&&(await h.requestPermission({mode:'readwrite'}))==='granted';}catch(e){}
    if(!ok){
      [h]=await showOpenFilePicker({types:[{description:'Application file',accept:{'text/html':['.html']}}]});
      const me=decodeURIComponent(location.pathname.split('/').pop());
      if(me&&h.name!==me)throw new Error('اسی فائل کو منتخب کریں: '+me);
      if((await h.requestPermission({mode:'readwrite'}))!=='granted')throw new Error('اجازت نہیں ملی');
    }
    const fileUrl=new URL(newer.url||'Malkhana_Samundri_Faisalabad.html',UPDATE_URL).href;
    const html=await(await fetch(fileUrl+'?t='+Date.now(),{cache:'no-store'})).text();
    if(!/^\s*<!DOCTYPE html/i.test(html)||!html.includes("APP_VERSION='"+newer.version+"'"))throw new Error('ڈاؤن لوڈ کی گئی فائل درست نہیں');
    const w=await h.createWritable();await w.write(html);await w.close();
    try{await idbSet('appHandle',h);}catch(e){}
    toast('ورژن '+newer.version+' انسٹال ہوگیا؛ دوبارہ لوڈ ہو رہا ہے…');
    setTimeout(()=>location.reload(),1500);
  }catch(e){if(e.name!=='AbortError')alert('اپڈیٹ ناکام: '+e.message);}
}
$('curVersion').textContent=APP_VERSION;
$('checkUpdateBtn').onclick=()=>checkUpdate(true);$('updateNowBtn').onclick=applyUpdate;
window.addEventListener('online',()=>checkUpdate(false));
setInterval(()=>checkUpdate(false),1800000);
restoreWorkbook();
checkUpdate(false);
</script>
